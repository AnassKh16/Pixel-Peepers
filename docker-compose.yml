services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
      DATABASE_URL: postgresql://nascon:nascon@postgres:5432/nascon
      REDIS_URL: redis://redis:6379
      MEDIA_API_URL: http://mediamtx:9997
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon
      POSTGRES_DB: nascon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon -d nascon"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  mediamtx:
    build:
      context: ./backend
      dockerfile: Dockerfile.mediamtx
    image: pixel-peepers-mediamtx:1.9.1
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    volumes:
      - ./backend/mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9997/v3/paths/list"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped
  selenium-hub:
    image: selenium/hub:4.24.0
    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status > /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
  node-chrome-1:
    image: selenium/node-chrome:4.24.0
    shm_size: "1gb"
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment: &browser-environment
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 2
      SE_START_VNC: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck: &browser-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:5555/status | grep -q '\"ready\": true'"]
      interval: 3s
      timeout: 3s
      retries: 40
  node-chrome-2:
    image: selenium/node-chrome:4.24.0
    shm_size: "1gb"
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment: *browser-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck: *browser-healthcheck
  node-firefox:
    image: selenium/node-firefox:4.24.0
    shm_size: "1gb"
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment: *browser-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck: *browser-healthcheck
volumes:
  postgres_data:
  redis_data:
